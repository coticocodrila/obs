<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{% include seo.html %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{% include bandera.html %}<span><b>{{ site.title }}</b><small>Vigilancia, investigación y prevención</small></span></a>
    <nav class="links" aria-label="Principal">
      <a href="{{ '/' | relative_url }}">Inicio</a>
      <a href="{{ '/noticias/' | relative_url }}"{% if page.url == '/noticias/' %} aria-current="page"{% endif %}>Noticias</a>
      <a href="{{ '/#reportar' | relative_url }}">Reportar un caso</a>
    </nav>
  </div>
</header>
<main>
{{ content }}
</main>
<footer class="foot">
  <div class="wrap">
    <span>© {{ site.time | date: "%Y" }} {{ site.title }}</span>
    <span><a href="{{ '/#contacto' | relative_url }}">Contacto</a> · <a href="{{ '/admin/' | relative_url }}" rel="nofollow">Acceso administradoras</a></span>
  </div>
</footer>
</body>
</html>
