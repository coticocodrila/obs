# Panel de administración del sitio (Pages CMS · pagescms.org)
media:
  input: media
  output: /media

content:
  - name: noticias
    label: Noticias
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, published, tags]
      primary: title
      sort: [date, title]
      search: [title, subtitulo]
      default:
        sort: date
        order: desc
    fields:
      - name: published
        label: Noticia activa
        type: boolean
        default: true
        description: "Activa = visible en el sitio. Desactívala para guardarla como borrador u ocultarla sin borrarla."
      - name: title
        label: Título
        type: string
        required: true
        options:
          maxlength: 110
      - name: subtitulo
        label: Subtítulo
        type: text
        required: true
        description: "1 o 2 líneas. Aparece bajo el título, en la portada, en el listado y al compartir el enlace."
        options:
          maxlength: 220
      - name: date
        label: Fecha de publicación
        type: date
        options:
          format: yyyy-MM-dd
      - name: autora
        label: Autora (opcional)
        type: string
      - name: imagen
        label: Imagen principal
        type: image
        description: "Horizontal, idealmente 1200 × 630 px y menos de 500 KB. Es la que muestran Google, WhatsApp y redes sociales al compartir."
      - name: imagen_alt
        label: Descripción de la imagen
        type: string
        description: "Qué se ve en la foto, en una frase. Ayuda a buscadores y a personas con lectores de pantalla."
      - name: tags
        label: Temas (tags)
        type: select
        description: "Elige uno o más. Permiten filtrar las noticias por tema."
        options:
          multiple: true
          values: ["Capacitación", "Investigación", "Prevención", "Comunidades", "Alianzas", "Eventos", "Publicaciones", "Prensa"]
      - name: seo
        label: SEO (buscadores)
        type: object
        fields:
          - name: descripcion
            label: Descripción para Google
            type: text
            description: "Opcional. Máximo 160 caracteres. Si la dejas vacía se usa el subtítulo."
            options:
              maxlength: 160
          - name: palabras_clave
            label: Palabras clave (keywords)
            type: string
            list: true
            description: "Opcional. Una palabra o frase por casilla, por ejemplo: enfermedad descompresiva."
      - name: body
        label: Cuerpo de texto
        type: rich-text
        options:
          format: markdown
  - name: publicaciones
    label: "Publicaciones"
    type: file
    path: content/publicaciones.json
    format: json
    fields:
      - { name: etiqueta, label: "Etiqueta", type: string }
      - { name: titulo, label: "Título", type: string }
      - name: items
        label: "Publicaciones"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titulo}"
        fields:
          - { name: tipo, label: "Tipo", type: string }
          - { name: titulo, label: "Título", type: string }
          - { name: fecha, label: "Año o fecha", type: string }
          - { name: enlace, label: "Archivo PDF o enlace", type: file }
  - name: portada
    label: "Portada"
    type: file
    path: content/portada.json
    format: json
    fields:
      - { name: etiqueta, label: "Etiqueta superior", type: string }
      - { name: titulo, label: "Título", type: text }
      - { name: texto, label: "Texto", type: text }
      - { name: boton_principal, label: "Botón principal", type: string }
      - { name: boton_principal_enlace, label: "Enlace botón principal", type: string }
      - { name: boton_secundario, label: "Botón secundario", type: string }
      - { name: boton_secundario_enlace, label: "Enlace botón secundario", type: string }
      - { name: imagen, label: "Imagen (vertical 1200×1500)", type: image }
      - { name: video, label: "Video MP4 o enlace YouTube/Vimeo (opcional", type: string }
  - name: aviso
    label: "Franja de emergencia"
    type: file
    path: content/aviso.json
    format: json
    fields:
      - { name: mostrar, label: "Mostrar franja", type: boolean }
      - { name: texto, label: "Texto", type: string }
      - { name: telefono, label: "Teléfono de emergencia", type: string }
  - name: cifras
    label: "Cifras"
    type: file
    path: content/cifras.json
    format: json
    fields:
      - { name: titulo, label: "Título", type: string }
      - { name: nota, label: "Nota al pie", type: string }
      - name: items
        label: "Cifras"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{valor} {unidad}"
        fields:
          - { name: valor, label: "Valor", type: string }
          - { name: unidad, label: "Unidad", type: string }
          - { name: texto, label: "Descripción", type: string }
  - name: nosotros
    label: "Quiénes somos"
    type: file
    path: content/nosotros.json
    format: json
    fields:
      - { name: etiqueta, label: "Etiqueta", type: string }
      - { name: titulo, label: "Título", type: string }
      - { name: texto, label: "Texto (separa párrafos con una línea en blanco)", type: text }
      - { name: mision, label: "Misión", type: text }
      - { name: vision, label: "Visión", type: text }
      - { name: imagen, label: "Imagen (1200×900)", type: image }
  - name: enfermedades
    label: "Enfermedades"
    type: file
    path: content/enfermedades.json
    format: json
    fields:
      - { name: etiqueta, label: "Etiqueta", type: string }
      - { name: titulo, label: "Título", type: string }
      - { name: texto, label: "Introducción", type: text }
      - name: items
        label: "Enfermedades"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{nombre}"
        fields:
          - { name: nombre, label: "Nombre", type: string }
          - { name: profundidad, label: "Momento de la inmersión", type: string }
          - { name: texto, label: "Descripción", type: text }
          - { name: imagen, label: "Imagen (opcional)", type: image }
  - name: lineas
    label: "Líneas de trabajo"
    type: file
    path: content/lineas.json
    format: json
    fields:
      - { name: etiqueta, label: "Etiqueta", type: string }
      - { name: titulo, label: "Título", type: string }
      - name: items
        label: "Líneas"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titulo}"
        fields:
          - { name: titulo, label: "Título", type: string }
          - { name: texto, label: "Texto", type: text }
  - name: video
    label: "Video"
    type: file
    path: content/video.json
    format: json
    fields:
      - { name: etiqueta, label: "Etiqueta", type: string }
      - { name: titulo, label: "Título", type: string }
      - { name: texto, label: "Texto", type: text }
      - { name: video, label: "Enlace YouTube/Vimeo o archivo MP4", type: string }
      - { name: portada, label: "Imagen de portada del video (solo MP4)", type: image }
  - name: reportar
    label: "Reportar un caso"
    type: file
    path: content/reportar.json
    format: json
    fields:
      - { name: etiqueta, label: "Etiqueta", type: string }
      - { name: titulo, label: "Título", type: string }
      - { name: texto, label: "Texto", type: text }
      - { name: pasos, label: "Pasos", type: string, list: true }
      - { name: aviso_privacidad, label: "Aviso de privacidad", type: text }
      - { name: boton, label: "Texto del botón", type: string }
      - { name: formulario_destino, label: "URL de envío (Formspree)", type: string }
  - name: aliados
    label: "Aliados"
    type: file
    path: content/aliados.json
    format: json
    fields:
      - { name: titulo, label: "Título", type: string }
      - name: items
        label: "Instituciones"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{nombre}"
        fields:
          - { name: nombre, label: "Nombre", type: string }
          - { name: logo, label: "Logo", type: image }
          - { name: enlace, label: "Sitio web", type: string }
  - name: contacto
    label: "Contacto"
    type: file
    path: content/contacto.json
    format: json
    fields:
      - { name: etiqueta, label: "Etiqueta", type: string }
      - { name: titulo, label: "Título", type: string }
      - { name: texto, label: "Texto", type: text }
  - name: sitio
    label: "Datos generales"
    type: file
    path: content/sitio.json
    format: json
    fields:
      - { name: nombre, label: "Nombre", type: string }
      - { name: nombre_corto, label: "Sigla", type: string }
      - { name: bajada, label: "Bajada bajo el nombre", type: string }
      - { name: correo, label: "Correo", type: string }
      - { name: telefono, label: "Teléfono", type: string }
      - { name: direccion, label: "Dirección", type: string }
      - { name: instagram, label: "Instagram (enlace)", type: string }
      - { name: facebook, label: "Facebook (enlace)", type: string }
      - { name: youtube, label: "YouTube (enlace)", type: string }
