<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Observatorio de Enfermedades del Buceo</title>
<meta name="description" content="Vigilancia, investigación y prevención de las enfermedades asociadas al buceo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: una inmersión. Cada sección es una cota de profundidad; el sitio baja de la superficie (claro) al fondo (azul profundo). */
:root {
  --surface: #F2F6F7;      /* agua en superficie */
  --paper: #FFFFFF;
  --ink: #0A2230;          /* azul petróleo casi negro */
  --muted: #4B6573;
  --line: #CAD8DE;
  --sea: #0D5C74;          /* azul mar */
  --flag: #D23A2C;         /* rojo bandera de buceo */
  --flag-ink: #FFFFFF;
  --deep: #071A26;         /* fondo marino: igual en ambos temas */
  --deep-2: #0C2635;
  --deep-fg: #E3EEF2;
  --deep-muted: #8FB0BE;
  --deep-line: #1E4053;
  --ph: #DCE7EB;           /* relleno de espacios para imágenes */
  --ph-stripe: #CFDDE3;

  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --s-1: clamp(2.4rem, 1.4rem + 4.2vw, 4.6rem);
  --s-2: clamp(1.8rem, 1.3rem + 2vw, 2.8rem);
  --s-3: 1.3rem;
  --s-body: 1.0625rem;
  --s-small: .875rem;
  --s-label: .75rem;

  --wrap: 1180px;
  --gutter: clamp(16px, 4vw, 40px);
  --radius: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #0B1D28; --paper: #10283A; --ink: #E6F0F3; --muted: #9BB5C1; --line: #22465A;
    --sea: #58B6D3; --flag: #F0563F; --ph: #133146; --ph-stripe: #173A51; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --surface: #0B1D28; --paper: #10283A; --ink: #E6F0F3; --muted: #9BB5C1; --line: #22465A;
  --sea: #58B6D3; --flag: #F0563F; --ph: #133146; --ph-stripe: #173A51; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--f-body); font-size: var(--s-body); line-height: 1.6; -webkit-font-smoothing: antialiased; }
img, video { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 112%; line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--flag); outline-offset: 3px; }

.wrap { max-width: var(--wrap); margin-inline: auto; padding-inline: var(--gutter); }
.label { font-family: var(--f-mono); font-size: var(--s-label); letter-spacing: .08em; text-transform: uppercase; color: var(--sea); }
.lead { color: var(--muted); max-width: 62ch; }

/* Bandera de buceo como marca */
.flag { width: 30px; height: 22px; flex: none; border-radius: 2px; }

/* Aviso de emergencia */
.alert { background: var(--flag); color: var(--flag-ink); font-size: var(--s-small); }
.alert .wrap { display: flex; flex-wrap: wrap; gap: .25rem 1rem; padding-block: .55rem; align-items: baseline; }
.alert strong { font-family: var(--f-mono); font-weight: 500; }

/* Navegación */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 1.5rem; padding-block: .8rem; }
.brand { display: flex; align-items: center; gap: .7rem; text-decoration: none; min-width: 0; }
.brand b { font-family: var(--f-display); font-stretch: 115%; font-weight: 700; font-size: 1rem; line-height: 1.1; }
.brand small { display: block; font-family: var(--f-mono); font-size: .68rem; color: var(--muted); letter-spacing: .04em; }
.nav ul { display: flex; gap: 1.4rem; list-style: none; margin: 0 0 0 auto; padding: 0; font-size: var(--s-small); }
.nav ul a { text-decoration: none; color: var(--muted); }
.nav ul a:hover { color: var(--ink); }
.btn { display: inline-flex; align-items: center; gap: .5rem; font: 600 var(--s-small)/1 var(--f-body); padding: .85rem 1.2rem; border-radius: var(--radius); text-decoration: none; border: 1px solid transparent; cursor: pointer; }
.btn-flag { background: var(--flag); color: var(--flag-ink); }
.btn-flag:hover { filter: brightness(1.08); }
.btn-ghost { border-color: currentColor; color: var(--ink); background: transparent; }
@media (max-width: 860px) { .nav ul { display: none; } .nav .btn { margin-left: auto; } }

/* Secciones con cota de profundidad */
section { position: relative; padding-block: clamp(4rem, 8vw, 7rem); }
.depth { font-family: var(--f-mono); font-size: var(--s-label); color: var(--muted); display: flex; align-items: center; gap: .6rem; margin-bottom: 1.4rem; font-variant-numeric: tabular-nums; }
.depth::before { content: ""; width: 28px; height: 1px; background: currentColor; }
.head { display: grid; gap: 1rem; margin-bottom: clamp(2rem, 4vw, 3.2rem); }
.head h2 { font-size: var(--s-2); font-weight: 700; }

/* Placeholder de medios */
.media { position: relative; background: var(--ph) repeating-linear-gradient(135deg, var(--ph-stripe) 0 1px, transparent 1px 14px); border-radius: var(--radius); overflow: hidden; display: grid; place-items: center; aspect-ratio: 4 / 3; max-width: 100%; color: var(--muted); }
.media img, .media video { width: 100%; height: 100%; object-fit: cover; }
.media iframe { width: 100%; height: 100%; border: 0; }
.media .ph { font-family: var(--f-mono); font-size: var(--s-label); text-align: center; padding: 1rem; display: grid; gap: .35rem; justify-items: center; }
.media .ph svg { width: 26px; height: 26px; opacity: .7; }

/* Portada */
.hero { padding-block: clamp(3rem, 6vw, 5.5rem) clamp(3rem, 6vw, 5rem); }
.hero .wrap { display: grid; grid-template-columns: 1.15fr 1fr; gap: clamp(2rem, 5vw, 4.5rem); align-items: center; }
.hero h1 { font-size: var(--s-1); font-weight: 800; font-stretch: 118%; margin-block: 1.1rem 1.4rem; }
.hero .lead { font-size: 1.125rem; }
.hero .actions { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 2rem; }
.hero .media { aspect-ratio: 4 / 5; }
.hero-side { position: relative; min-width: 0; }
.gauge { position: absolute; left: -2.2rem; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: space-between; font-family: var(--f-mono); font-size: .65rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.gauge span::after { content: " —"; }
@media (max-width: 860px) {
  .hero .wrap { grid-template-columns: 1fr; }
  .hero .media { aspect-ratio: 16 / 10; }
  .gauge { display: none; }
}

/* Cifras */
.stats { padding-block: 0 clamp(3rem, 6vw, 5rem); }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--ink); }
.stat { padding: 1.4rem 1.2rem 0 0; display: grid; gap: .4rem; align-content: start; min-width: 0; }
.stat + .stat { padding-left: 1.2rem; border-left: 1px solid var(--line); }
.stat b { font-family: var(--f-display); font-stretch: 125%; font-size: clamp(2.2rem, 4vw, 3.2rem); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat b small { font-family: var(--f-mono); font-size: var(--s-label); font-weight: 400; color: var(--sea); margin-left: .4rem; letter-spacing: .06em; text-transform: uppercase; }
.stat p { color: var(--muted); font-size: var(--s-small); }
.note { margin-top: 1rem; font-family: var(--f-mono); font-size: .7rem; color: var(--muted); }
@media (max-width: 860px) {
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .stat, .stat + .stat { padding: 1.2rem 1rem 1.2rem 0; border-left: 0; }
  .stat:nth-child(even) { padding-left: 1rem; border-left: 1px solid var(--line); }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
}

/* Nosotros */
.about { background: var(--paper); }
.about .grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: clamp(2rem, 5vw, 4.5rem); align-items: start; }
.about .body { display: grid; gap: 1.1rem; min-width: 0; }
.about .body p { color: var(--muted); max-width: 62ch; }
.mv { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1.2rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
.mv h3 { font-size: 1rem; margin-bottom: .5rem; }
.mv p { font-size: var(--s-small); }
@media (max-width: 860px) { .about .grid, .mv { grid-template-columns: 1fr; } }

/* Enfermedades */
.dz-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.dz { background: var(--surface); padding: 1.6rem; display: grid; gap: .8rem; align-content: start; min-width: 0; }
.dz .tag { font-family: var(--f-mono); font-size: .7rem; color: var(--sea); display: flex; align-items: center; gap: .45rem; }
.dz .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--flag); }
.dz h3 { font-size: var(--s-3); font-weight: 700; }
.dz p { font-size: var(--s-small); color: var(--muted); }
.dz .media { aspect-ratio: 16 / 9; margin-bottom: .4rem; }
@media (max-width: 960px) { .dz-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .dz-grid { grid-template-columns: 1fr; } }

/* Líneas de trabajo */
.lines { background: var(--paper); }
.ln-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(1.2rem, 3vw, 2.2rem); }
.ln { display: grid; gap: .7rem; align-content: start; border-top: 2px solid var(--ink); padding-top: 1.1rem; min-width: 0; }
.ln h3 { font-size: var(--s-3); }
.ln p { color: var(--muted); font-size: var(--s-small); }
@media (max-width: 860px) { .ln-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .ln-grid { grid-template-columns: 1fr; } }

/* Zona profunda: video + reporte */
.deep { background: var(--deep); color: var(--deep-fg); }
.deep .depth, .deep .lead, .deep p { color: var(--deep-muted); }
.deep .label { color: #6FC3DD; }
.deep h2, .deep h3 { color: var(--deep-fg); }
.deep .media { --ph: var(--deep-2); --ph-stripe: #12324480; color: var(--deep-muted); }
.video .media { aspect-ratio: 16 / 9; margin-top: 1rem; }
.video-head { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: end; }
@media (max-width: 760px) { .video-head { grid-template-columns: 1fr; } }

.report { border-top: 1px solid var(--deep-line); }
.report .grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: clamp(2rem, 5vw, 4.5rem); align-items: start; }
.steps { list-style: none; padding: 0; margin: 2rem 0 0; display: grid; gap: 1.1rem; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 2.2rem 1fr; gap: .8rem; counter-increment: s; color: var(--deep-fg); font-size: var(--s-small); }
.steps li::before { content: counter(s); font-family: var(--f-mono); width: 2.2rem; height: 2.2rem; border: 1px solid var(--deep-line); border-radius: 50%; display: grid; place-items: center; color: #6FC3DD; }
.form { background: var(--deep-2); border: 1px solid var(--deep-line); border-radius: var(--radius); padding: clamp(1.2rem, 3vw, 2rem); display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.1rem; min-width: 0; }
.form .full { grid-column: 1 / -1; }
.field { display: grid; gap: .4rem; min-width: 0; }
.field label { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; color: var(--deep-muted); }
.field input, .field select, .field textarea { font: inherit; font-size: var(--s-small); color: var(--deep-fg); background: var(--deep); border: 1px solid var(--deep-line); border-radius: var(--radius); padding: .7rem .8rem; width: 100%; color-scheme: dark; }
.field textarea { min-height: 110px; resize: vertical; }
.field .unit { position: relative; }
.field .unit span { position: absolute; right: .8rem; top: 50%; transform: translateY(-50%); font-family: var(--f-mono); font-size: .75rem; color: var(--deep-muted); pointer-events: none; }
.form .privacy { font-size: .78rem; color: var(--deep-muted); }
.form .ok { grid-column: 1 / -1; font-size: var(--s-small); color: #8FE0B5; }
@media (max-width: 860px) { .report .grid { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .form { grid-template-columns: 1fr; } }

/* Publicaciones */
.pubs { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.pubs li { border-bottom: 1px solid var(--line); }
.pubs a, .pubs .row { display: grid; grid-template-columns: 8rem 1fr auto; gap: 1rem; padding: 1.15rem 0; align-items: baseline; text-decoration: none; }
.pubs .t { font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--sea); }
.pubs .n { font-weight: 600; min-width: 0; }
.pubs .d { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.pubs a:hover .n { text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 600px) { .pubs a, .pubs .row { grid-template-columns: 1fr auto; } .pubs .t { grid-column: 1 / -1; } }

/* Noticias */
.news { background: var(--paper); }
.nw-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(1.2rem, 3vw, 2rem); }
.nw { display: grid; gap: .7rem; align-content: start; text-decoration: none; min-width: 0; }
.nw .media { aspect-ratio: 3 / 2; margin-bottom: .3rem; }
.nw time { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.nw h3 { font-size: 1.15rem; font-stretch: 105%; line-height: 1.2; }
.nw p { font-size: var(--s-small); color: var(--muted); }
@media (max-width: 860px) { .nw-grid { grid-template-columns: 1fr; } .nw .media { aspect-ratio: 16 / 9; } }

/* Aliados */
.partners { padding-block: clamp(3rem, 6vw, 4.5rem); }
.pt-grid { display: flex; flex-wrap: wrap; gap: 1rem; }
.pt { flex: 1 1 160px; height: 84px; display: grid; place-items: center; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); font-family: var(--f-mono); font-size: .72rem; text-align: center; padding: .8rem; text-decoration: none; }
.pt img { max-height: 52px; width: auto; object-fit: contain; }

/* Contacto + pie */
.contact { background: var(--deep); color: var(--deep-fg); }
.contact .grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 2.5rem; align-items: end; }
.contact h2 { font-size: var(--s-1); font-weight: 800; font-stretch: 120%; }
.contact .lead { color: var(--deep-muted); margin-top: 1.2rem; }
.contact dl { margin: 0; display: grid; gap: 1.1rem; }
.contact dt { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: #6FC3DD; }
.contact dd { margin: .2rem 0 0; font-size: 1.05rem; overflow-wrap: anywhere; }
.contact dd a { text-decoration: none; border-bottom: 1px solid var(--deep-line); }
.foot { border-top: 1px solid var(--deep-line); margin-top: clamp(3rem, 6vw, 5rem); padding-top: 1.5rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; font-size: .8rem; color: var(--deep-muted); }
.foot .social { display: flex; gap: 1rem; }
.foot a { color: var(--deep-fg); }
@media (max-width: 760px) { .contact .grid { grid-template-columns: 1fr; } }

/* Profundímetro flotante */
.meter { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--deep); color: var(--deep-fg); border: 1px solid var(--deep-line); border-radius: 999px; padding: .45rem .9rem .45rem .7rem; font-family: var(--f-mono); font-size: .72rem; display: flex; align-items: center; gap: .55rem; font-variant-numeric: tabular-nums; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.meter i { width: 8px; height: 8px; border-radius: 50%; background: #6FC3DD; }
.meter b { font-weight: 500; min-width: 3.2ch; text-align: right; }
.meter span { color: var(--deep-muted); }
</style>
</head>
<body>


<div id="app" aria-live="polite"></div>
<div class="meter" aria-hidden="true"><i></i><span>PROF.</span><b id="meter">0.0</b><span>m</span></div>

<script>
(function () {
  "use strict";

  // Contenido: se lee desde content/landing.json (lo edita el panel de administración).
  var FALLBACK = window.__CONTENT__ || null;

  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var u = function (s) { return String(s || "").replace(/^\/media\//, "media/"); };
  var paras = function (s) {
    return String(s || "").split(/\n\s*\n/).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
  };
  var ICON_IMG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="1"/><circle cx="9" cy="10" r="2"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>';
  var ICON_VID = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>';

  function youtubeId(u) {
    var m = String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    return m ? m[1] : null;
  }
  function vimeoId(u) {
    var m = String(u).match(/vimeo\.com\/(?:video\/)?(\d+)/);
    return m ? m[1] : null;
  }

  // Muestra imagen, video o un espacio reservado con la medida recomendada.
  function media(opts) {
    var cls = "media" + (opts.cls ? " " + opts.cls : "");
    if (opts.video) {
      var yt = youtubeId(opts.video), vm = vimeoId(opts.video);
      if (yt) return '<div class="' + cls + '"><iframe src="https://www.youtube-nocookie.com/embed/' + yt + '" title="' + esc(opts.alt) + '" allowfullscreen loading="lazy"></iframe></div>';
      if (vm) return '<div class="' + cls + '"><iframe src="https://player.vimeo.com/video/' + vm + '" title="' + esc(opts.alt) + '" allowfullscreen loading="lazy"></iframe></div>';
      return '<div class="' + cls + '"><video src="' + esc(u(opts.video)) + '"' + (opts.poster ? ' poster="' + esc(u(opts.poster)) + '"' : "") + (opts.autoplay ? " autoplay muted loop playsinline" : " controls") + ' preload="metadata"></video></div>';
    }
    if (opts.img) return '<div class="' + cls + '"><img src="' + esc(u(opts.img)) + '" alt="' + esc(opts.alt) + '" loading="lazy"></div>';
    return '<div class="' + cls + '"><div class="ph">' + (opts.isVideo ? ICON_VID : ICON_IMG) + "<span>" + esc(opts.label) + "</span>" + (opts.size ? "<span>" + esc(opts.size) + "</span>" : "") + "</div></div>";
  }

  function depth(m) { return '<div class="depth">' + m + " m</div>"; }
  function href(link, inner, cls) {
    return link ? '<a class="' + (cls || "") + '" href="' + esc(u(link)) + '" target="_blank" rel="noopener">' + inner + "</a>" : '<div class="' + (cls || "") + '">' + inner + "</div>";
  }

  var FLAG = '<svg class="flag" viewBox="0 0 30 22" aria-hidden="true"><rect width="30" height="22" fill="var(--flag)"/><path d="M0 0h6l24 17.6V22h-6L0 4.4z" fill="#fff"/></svg>';

  function render(c) {
    var s = c.sitio || {}, h = c.portada || {}, ci = c.cifras || {}, n = c.nosotros || {}, e = c.enfermedades || {},
        l = c.lineas || {}, v = c.video || {}, r = c.reportar || {}, pu = c.publicaciones || {}, nw = c.noticias || {},
        al = c.aliados || {}, co = c.contacto || {}, av = c.aviso || {};

    document.title = s.nombre || document.title;
    var out = [];

    if (av.mostrar) {
      out.push('<div class="alert" role="note"><div class="wrap"><span>' + esc(av.texto) + "</span><strong>" + esc(av.telefono) + "</strong></div></div>");
    }

    out.push('<header class="nav"><div class="wrap"><a class="brand" href="#inicio">' + FLAG + "<span><b>" + esc(s.nombre) + "</b><small>" + esc(s.bajada) + "</small></span></a>" +
      '<nav aria-label="Principal"><ul><li><a href="#nosotros">Nosotros</a></li><li><a href="#enfermedades">Enfermedades</a></li><li><a href="#recursos">Recursos</a></li><li><a href="#noticias">Noticias</a></li><li><a href="#contacto">Contacto</a></li></ul></nav>' +
      '<a class="btn btn-flag" href="#reportar">' + esc(h.boton_principal || "Reportar un caso") + "</a></div></header>");

    out.push('<main id="inicio">');

    // Portada
    out.push('<section class="hero" data-depth="0"><div class="wrap"><div>' + depth("0") +
      '<div class="label">' + esc(h.etiqueta) + "</div><h1>" + esc(h.titulo) + '</h1><p class="lead">' + esc(h.texto) + "</p>" +
      '<div class="actions"><a class="btn btn-flag" href="' + esc(h.boton_principal_enlace || "#reportar") + '">' + esc(h.boton_principal) + '</a><a class="btn btn-ghost" href="' + esc(h.boton_secundario_enlace || "#nosotros") + '">' + esc(h.boton_secundario) + "</a></div></div>" +
      '<div class="hero-side"><div class="gauge" aria-hidden="true"><span>0</span><span>10</span><span>20</span><span>30</span><span>40</span></div>' +
      media({ img: h.imagen, video: h.video, autoplay: true, alt: s.nombre, label: "Imagen o video de portada", size: "vertical · 1200 × 1500 px", isVideo: !!h.video }) +
      "</div></div></section>");

    // Cifras
    if ((ci.items || []).length) {
      out.push('<section class="stats" aria-label="' + esc(ci.titulo) + '"><div class="wrap"><div class="stats-grid">' +
        ci.items.map(function (i) { return '<div class="stat"><b>' + esc(i.valor) + "<small>" + esc(i.unidad) + "</small></b><p>" + esc(i.texto) + "</p></div>"; }).join("") +
        "</div>" + (ci.nota ? '<p class="note">' + esc(ci.nota) + "</p>" : "") + "</div></section>");
    }

    // Nosotros
    out.push('<section class="about" id="nosotros" data-depth="5"><div class="wrap grid"><div>' + depth("5") +
      media({ img: n.imagen, alt: n.titulo, label: "Foto del equipo o en terreno", size: "1200 × 900 px" }) +
      '</div><div class="body"><div class="label">' + esc(n.etiqueta) + '</div><h2 style="font-size:var(--s-2)">' + esc(n.titulo) + "</h2>" + paras(n.texto) +
      '<div class="mv"><div><h3>Misión</h3><p>' + esc(n.mision) + "</p></div><div><h3>Visión</h3><p>" + esc(n.vision) + "</p></div></div></div></div></section>");

    // Enfermedades
    out.push('<section id="enfermedades" data-depth="12"><div class="wrap">' + depth("12") +
      '<div class="head"><div class="label">' + esc(e.etiqueta) + "</div><h2>" + esc(e.titulo) + '</h2><p class="lead">' + esc(e.texto) + "</p></div>" +
      '<div class="dz-grid">' + (e.items || []).map(function (i) {
        return '<article class="dz">' + (i.imagen ? media({ img: i.imagen, alt: i.nombre }) : "") +
          '<div class="tag">' + esc(i.profundidad) + "</div><h3>" + esc(i.nombre) + "</h3><p>" + esc(i.texto) + "</p></article>";
      }).join("") + "</div></div></section>");

    // Líneas
    out.push('<section class="lines" data-depth="18"><div class="wrap">' + depth("18") +
      '<div class="head"><div class="label">' + esc(l.etiqueta) + "</div><h2>" + esc(l.titulo) + "</h2></div>" +
      '<div class="ln-grid">' + (l.items || []).map(function (i) {
        return '<div class="ln"><h3>' + esc(i.titulo) + "</h3><p>" + esc(i.texto) + "</p></div>";
      }).join("") + "</div></div></section>");

    // Zona profunda
    out.push('<div class="deep">');
    out.push('<section class="video" data-depth="25"><div class="wrap">' + depth("25") +
      '<div class="video-head"><div><div class="label">' + esc(v.etiqueta) + '</div><h2 style="font-size:var(--s-2);margin-top:1rem">' + esc(v.titulo) + '</h2></div><p class="lead">' + esc(v.texto) + "</p></div>" +
      media({ video: v.video, poster: v.portada, alt: v.titulo, label: "Video institucional (YouTube, Vimeo o MP4)", size: "horizontal · 16:9", isVideo: true }) +
      "</div></section>");

    out.push('<section class="report" id="reportar" data-depth="30"><div class="wrap grid"><div>' + depth("30") +
      '<div class="label">' + esc(r.etiqueta) + '</div><h2 style="font-size:var(--s-2);margin-block:1rem">' + esc(r.titulo) + '</h2><p class="lead">' + esc(r.texto) + "</p>" +
      '<ol class="steps">' + (r.pasos || []).map(function (p) { return "<li><span>" + esc(p) + "</span></li>"; }).join("") + "</ol></div>" +
      '<form class="form" id="report-form" name="reporte" method="POST"' + (r.formulario_destino ? ' action="' + esc(r.formulario_destino) + '"' : "") + '>' +
        '<div class="field"><label for="f-rol">Quién reporta</label><select id="f-rol" name="rol"><option>Buzo/a afectado/a</option><option>Testigo o compañero/a</option><option>Profesional de salud</option><option>Otro</option></select></div>' +
        '<div class="field"><label for="f-tipo">Tipo de buceo</label><select id="f-tipo" name="tipo"><option>Artesanal / mariscador</option><option>Profesional / industrial</option><option>Recreativo</option><option>Científico</option><option>Apnea</option><option>Otro</option></select></div>' +
        '<div class="field"><label for="f-fecha">Fecha de la inmersión</label><input id="f-fecha" name="fecha" type="date"></div>' +
        '<div class="field"><label for="f-lugar">Lugar / caleta</label><input id="f-lugar" name="lugar" type="text" placeholder="Ej.: Caleta, comuna"></div>' +
        '<div class="field"><label for="f-prof">Profundidad máxima</label><div class="unit"><input id="f-prof" name="profundidad" type="number" min="0" step="0.5" placeholder="0"><span>m</span></div></div>' +
        '<div class="field"><label for="f-tiempo">Tiempo de fondo</label><div class="unit"><input id="f-tiempo" name="tiempo" type="number" min="0" placeholder="0"><span>min</span></div></div>' +
        '<div class="field full"><label for="f-sint">¿Qué pasó? Síntomas y cuándo aparecieron</label><textarea id="f-sint" name="sintomas" placeholder="Describe lo ocurrido"></textarea></div>' +
        '<div class="field full"><label for="f-contacto">Correo o teléfono (opcional)</label><input id="f-contacto" name="contacto" type="text" placeholder="Para contactarte si necesitamos más datos"></div>' +
        '<p class="privacy full">' + esc(r.aviso_privacidad) + "</p>" +
        '<div class="full"><button class="btn btn-flag" type="submit">' + esc(r.boton || "Enviar reporte") + '</button></div><p class="ok" id="form-ok" hidden></p>' +
      "</form></div></section>");
    out.push("</div>");

    // Publicaciones
    out.push('<section id="recursos" data-depth="34"><div class="wrap">' + depth("34") +
      '<div class="head"><div class="label">' + esc(pu.etiqueta) + "</div><h2>" + esc(pu.titulo) + "</h2></div>" +
      '<ul class="pubs">' + (pu.items || []).map(function (i) {
        return "<li>" + href(i.enlace, '<span class="t">' + esc(i.tipo) + '</span><span class="n">' + esc(i.titulo) + '</span><span class="d">' + esc(i.fecha) + "</span>", i.enlace ? "" : "row") + "</li>";
      }).join("") + "</ul></div></section>");

    // Noticias
    out.push('<section class="news" id="noticias" data-depth="38"><div class="wrap">' + depth("38") +
      '<div class="head"><div class="label">' + esc(nw.etiqueta) + "</div><h2>" + esc(nw.titulo) + "</h2></div>" +
      '<div class="nw-grid">' + (nw.items || []).map(function (i) {
        return href(i.enlace, media({ img: i.imagen, alt: i.titulo, label: "Imagen de la noticia", size: "1200 × 800 px" }) +
          "<time>" + esc(i.fecha) + "</time><h3>" + esc(i.titulo) + "</h3><p>" + esc(i.texto) + "</p>", "nw");
      }).join("") + "</div></div></section>");

    // Aliados
    out.push('<section class="partners" data-depth="40"><div class="wrap"><div class="head"><div class="label">' + esc(al.titulo) + '</div></div><div class="pt-grid">' +
      (al.items || []).map(function (i) {
        return href(i.enlace, i.logo ? '<img src="' + esc(u(i.logo)) + '" alt="' + esc(i.nombre) + '">' : esc(i.nombre), "pt");
      }).join("") + "</div></div></section>");

    out.push("</main>");

    // Contacto
    var social = [["Instagram", s.instagram], ["Facebook", s.facebook], ["YouTube", s.youtube]].filter(function (x) { return x[1]; })
      .map(function (x) { return '<a href="' + esc(x[1]) + '" target="_blank" rel="noopener">' + x[0] + "</a>"; }).join("");
    out.push('<footer class="contact" id="contacto"><section style="padding-bottom:2rem" data-depth="40"><div class="wrap"><div class="grid"><div>' +
      '<div class="label">' + esc(co.etiqueta) + "</div><h2 style=\"margin-top:1rem\">" + esc(co.titulo) + '</h2><p class="lead">' + esc(co.texto) + "</p></div>" +
      "<dl><div><dt>Correo</dt><dd><a href=\"mailto:" + esc(s.correo) + '">' + esc(s.correo) + "</a></dd></div>" +
      "<div><dt>Teléfono</dt><dd>" + esc(s.telefono) + "</dd></div><div><dt>Dirección</dt><dd>" + esc(s.direccion) + "</dd></div></dl></div>" +
      '<div class="foot"><span>© ' + new Date().getFullYear() + " " + esc(s.nombre) + '</span><div class="social">' + social + "</div></div></div></section></footer>");

    document.getElementById("app").innerHTML = out.join("");
    wire(c);
  }

  function wire(c) {
    var form = document.getElementById("report-form");
    if (form) form.addEventListener("submit", function (ev) {
      var ok = document.getElementById("form-ok");
      // Con "formulario_destino" (p. ej. Formspree) el envío es real; sin él, solo muestra el aviso.
      if (!(c.reportar && c.reportar.formulario_destino)) {
        ev.preventDefault();
        ok.textContent = "Vista previa: en el sitio publicado este formulario enviará el reporte al equipo del observatorio.";
        ok.hidden = false;
      }
    });

    // Profundímetro: 0 m arriba, 40 m al llegar al pie.
    var meter = document.getElementById("meter");
    var tick = function () {
      var max = document.documentElement.scrollHeight - window.innerHeight;
      var d = max > 0 ? (window.scrollY / max) * 40 : 0;
      meter.textContent = d.toFixed(1);
    };
    window.addEventListener("scroll", tick, { passive: true });
    tick();
  }

  if (FALLBACK) { render(FALLBACK); }
  else {
    // Un archivo por sección: así el panel muestra cada una por separado.
    var KEYS = ["sitio", "aviso", "portada", "cifras", "nosotros", "enfermedades", "lineas", "video", "reportar", "publicaciones", "noticias", "aliados", "contacto"];
    Promise.all(KEYS.map(function (k) {
      return fetch("content/" + k + ".json", { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : {}; })
        .catch(function () { return {}; });
    }))
      .then(function (parts) { var c = {}; KEYS.forEach(function (k, i) { c[k] = parts[i]; }); render(c); })
      .catch(function () {
        document.getElementById("app").innerHTML = '<p style="padding:2rem">No se pudo cargar el contenido.</p>';
      });
  }
})();
</script>

</body>
</html>
